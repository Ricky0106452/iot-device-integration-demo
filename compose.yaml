name: okgo-demo

services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: iot_demo
      POSTGRES_PASSWORD: iot_demo_local
      POSTGRES_DB: iot_demo
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot_demo -d iot_demo"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
