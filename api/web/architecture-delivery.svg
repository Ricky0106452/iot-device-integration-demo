<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 545" role="img" aria-labelledby="title desc"><title id="title">CI/CD 自動部署流程</title><desc id="desc">GitHub 測試通過後更新可部署版本，EC2 每分鐘主動拉取、備份、遷移、更新並驗證，再回報 GitHub。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#43847d"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#182d40}.heading{font-size:17px;font-weight:650}.detail{font-size:14px;fill:#526879}.group{font-size:15px;font-weight:650;fill:#42736d}.edge{font-size:13px;fill:#526879}</style>
<rect x="20" y="15" width="450" height="515" rx="16" fill="#f7fafb" stroke="#b9cbd5" stroke-dasharray="7 5"/><text x="40" y="45" class="group">GitHub Actions · 獨立測試環境</text>
<rect x="530" y="15" width="450" height="515" rx="16" fill="#f7fafb" stroke="#b9cbd5" stroke-dasharray="7 5"/><text x="550" y="45" class="group">AWS EC2 · systemd 定時部署</text>
<path d="M245 135V175" fill="none" stroke="#43847d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M245 260V300" fill="none" stroke="#43847d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M755 135V175" fill="none" stroke="#43847d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M755 260V300" fill="none" stroke="#43847d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M755 370V410" fill="none" stroke="#43847d" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M440 335H495V103H560" fill="none" stroke="#43847d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="284" text-anchor="middle" class="edge">主機主動拉取</text>
<path d="M560 455H440" fill="none" stroke="#43847d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="438" text-anchor="middle" class="edge">成功狀態</text>
<rect x="50" y="70" width="390" height="65" rx="12" fill="white" stroke="#b9d3cf"/>
<text x="245.0" y="99" text-anchor="middle" class="heading">PR／main 變更</text>
<text x="245.0" y="123" text-anchor="middle" class="detail">觸發 GitHub-hosted CI</text>
<rect x="50" y="175" width="390" height="85" rx="12" fill="#eaf6f2" stroke="#b9d3cf"/>
<text x="245.0" y="204" text-anchor="middle" class="heading">完整測試</text>
<text x="245.0" y="228" text-anchor="middle" class="detail">獨立 PostgreSQL＋MQTT Broker</text>
<text x="245.0" y="250" text-anchor="middle" class="detail">測試失敗就不晉級部署版本</text>
<rect x="50" y="300" width="390" height="70" rx="12" fill="white" stroke="#b9d3cf"/>
<text x="245.0" y="329" text-anchor="middle" class="heading">只有 main 且測試通過</text>
<text x="245.0" y="353" text-anchor="middle" class="detail">更新 codex/deploy-ready 指標</text>
<rect x="50" y="410" width="390" height="85" rx="12" fill="#eaf6f2" stroke="#b9d3cf"/>
<text x="245.0" y="439" text-anchor="middle" class="heading">確認部署結果</text>
<text x="245.0" y="463" text-anchor="middle" class="detail">經 HTTPS 核對 commit SHA</text>
<text x="245.0" y="485" text-anchor="middle" class="detail">再次確認四個點位持續入庫</text>
<rect x="560" y="70" width="390" height="65" rx="12" fill="white" stroke="#b9d3cf"/>
<text x="755.0" y="99" text-anchor="middle" class="heading">每分鐘檢查部署指標</text>
<text x="755.0" y="123" text-anchor="middle" class="detail">已成功的相同版本不重建</text>
<rect x="560" y="175" width="390" height="85" rx="12" fill="#eaf6f2" stroke="#b9d3cf"/>
<text x="755.0" y="204" text-anchor="middle" class="heading">下載固定 commit SHA</text>
<text x="755.0" y="228" text-anchor="middle" class="detail">主機建置 Docker image</text>
<text x="755.0" y="250" text-anchor="middle" class="detail">保留主機私有設定與 volumes</text>
<rect x="560" y="300" width="390" height="70" rx="12" fill="white" stroke="#b9d3cf"/>
<text x="755.0" y="329" text-anchor="middle" class="heading">資料庫備份 → migration</text>
<text x="755.0" y="353" text-anchor="middle" class="detail">migration 失敗就停止後續更新</text>
<rect x="560" y="410" width="390" height="85" rx="12" fill="#eaf6f2" stroke="#b9d3cf"/>
<text x="755.0" y="439" text-anchor="middle" class="heading">更新 Compose → 驗證量測</text>
<text x="755.0" y="463" text-anchor="middle" class="detail">成功後發布 deployment.json</text>
<text x="755.0" y="485" text-anchor="middle" class="detail">GitHub 不透過 SSH 控制主機</text>
</svg>