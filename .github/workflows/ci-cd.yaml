name: CI and deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 不取消已經進行中的正式部署；同一分支依序處理。
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: iot_demo
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: okgo_points_check_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iot_demo -d okgo_points_check_ci"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://iot_demo:ci-only-password@127.0.0.1:5432/okgo_points_check_ci
      IOT_TEST_DATABASE_URL: postgresql+psycopg://iot_demo:ci-only-password@127.0.0.1:5432/okgo_points_check_ci
      IOT_MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://iot_demo:ci-only-password@127.0.0.1:5432/okgo_points_check_migration
      IOT_RECOVERY_BROKER_PORT: '18884'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Prepare isolated databases and MQTT broker
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U iot_demo okgo_points_check_migration
          docker run -d --name ci-mosquitto -p 127.0.0.1:18884:1883             -v "$GITHUB_WORKSPACE/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"             eclipse-mosquitto:2.1.2-alpine
          python -m alembic upgrade head
          python - <<'PY'
          import socket, time
          for attempt in range(30):
              try:
                  socket.create_connection(('127.0.0.1', 18884), timeout=1).close()
                  break
              except OSError:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PY
      - name: Run complete suite (skips fail CI)
        run: python scripts/run_ci.py
      - name: Check cloud deployment configuration
        env:
          POSTGRES_PASSWORD: config-validation-only
          DEMO_DOMAIN: demo.example.com
        run: |
          docker compose -f compose.yaml -f deploy/compose.cloud.yaml config --quiet
          bash -n deploy/pull-deploy.sh deploy/bootstrap-ubuntu.sh
      - name: Failure diagnostics
        if: failure()
        run: docker logs ci-mosquitto || true

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Promote the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/codex/deploy-ready" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/codex/deploy-ready" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/codex/deploy-ready -f sha="$GITHUB_SHA"
          fi
      - name: Wait for server deployment and verify live measurements
        run: python3 deploy/verify-live.py --base-url https://16-176-3-35.sslip.io --revision "$GITHUB_SHA" --wait 720
