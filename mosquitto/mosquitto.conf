# Local development only. Host exposure is limited by compose.yaml.
listener 1883 0.0.0.0
allow_anonymous true
# 保存工作階段與待送訊息；不代表每筆 PUBACK 都同步落盤。
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
# 單一訂閱者最多一筆未確認，讓 DB 故障時的積壓主要留在 Broker。
max_inflight_messages 1
# 沿用 Mosquitto 的 1000 筆預設上限，明確列出；容量滿後不保證完整補回。
max_queued_messages 1000
# 本階段不自動清除離線工作階段；訊息仍受容量上限限制。
log_dest stdout
connection_messages true
